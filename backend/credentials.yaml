# config/credentials.yaml
version: 1.0.0
lastUpdated: 2024-01-15

issuer:
  name: "University of Example"
  logo: "https://university.edu/logo.png"
  description: "Official credential issuer"
  primaryColor: "#1E3A8A"
  textColor: "#FFFFFF"

credentials:
  - id: university-degree
    name: University Degree
    description: Official university degree
    format: sd-jwt
    credentialType: UniversityDegreeCredential
    display:
      background: "#1E3A8A"
    fields:
      - name: Student Name
        path: [student, name]
        required: true
        type: text
      - name: Degree Type
        path: [degree, type]
        required: true
        type: select
        options: [Bachelor, Master, Doctorate]
    active: true
    tags: [academic, official]

settings:
  defaultValidityDays: 365
  allowBatchIssuance: true
  maxBatchSize: 50
  supportedProofTypes: [jwt]
  supportedAlgorithms: [ES256, EdDSA]